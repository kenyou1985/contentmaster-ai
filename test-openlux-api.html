<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLux API 诊断工具</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #00d4ff; }
    .test-section { background: #16213e; padding: 20px; border-radius: 10px; margin: 20px 0; }
    .test-result { background: #0f3460; padding: 10px; border-radius: 5px; margin: 10px 0; font-family: monospace; }
    .success { border-left: 4px solid #00ff88; }
    .error { border-left: 4px solid #ff4444; }
    .warning { border-left: 4px solid #ffaa00; }
    input { width: 100%; padding: 10px; margin: 10px 0; background: #0f3460; border: 1px solid #333; color: #fff; border-radius: 5px; }
    button { background: #00d4ff; color: #000; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    button:hover { background: #00a8cc; }
    button:disabled { background: #555; cursor: not-allowed; }
    pre { background: #0a0a15; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>OpenLux AI API 诊断工具</h1>
  
  <div class="test-section">
    <h2>1. 配置信息</h2>
    <input type="text" id="apiKey" placeholder="输入你的 OpenLux API Key (sk- 开头)">
    <input type="text" id="baseUrl" value="https://api.openlux.ai" placeholder="API Base URL">
  </div>

  <div class="test-section">
    <h2>2. Chat Completions 测试</h2>
    <button onclick="testChat()">测试 /v1/chat/completions</button>
    <div id="chatResult" class="test-result"></div>
  </div>

  <div class="test-section">
    <h2>3. 图片生成测试 - GPT Image 2</h2>
    <p>模型: gpt-image-2 | 端点: /v1/images/generations</p>
    <input type="text" id="imagePrompt" value="A beautiful sunset over the ocean" placeholder="图片提示词">
    <input type="text" id="imageSize" value="1024x1024" placeholder="尺寸 (如 1024x1024)">
    <button onclick="testGptImage2()">测试 GPT Image 2</button>
    <div id="gptImageResult" class="test-result"></div>
  </div>

  <div class="test-section">
    <h2>4. Gemini 原生图片生成测试</h2>
    <p>模型: gemini-3.1-flash-image-preview | 端点: /v1beta/models/{model}:generateContent</p>
    <input type="text" id="geminiPrompt" value="A beautiful sunset over the ocean" placeholder="图片提示词">
    <button onclick="testGeminiImage()">测试 Gemini 图片生成</button>
    <div id="geminiResult" class="test-result"></div>
  </div>

  <div class="test-section">
    <h2>5. 模型列表测试</h2>
    <button onclick="testModels()">获取可用模型</button>
    <div id="modelsResult" class="test-result"></div>
  </div>

  <script>
    function getConfig() {
      return {
        apiKey: document.getElementById('apiKey').value.trim(),
        baseUrl: document.getElementById('baseUrl').value.trim().replace(/\/$/, '')
      };
    }

    function log(elementId, type, message, data = null) {
      const el = document.getElementById(elementId);
      const dataStr = data ? '\n\n响应数据:\n' + JSON.stringify(data, null, 2) : '';
      el.className = 'test-result ' + type;
      el.innerHTML = '<pre>' + message + dataStr + '</pre>';
    }

    async function testChat() {
      const { apiKey, baseUrl } = getConfig();
      if (!apiKey) {
        log('chatResult', 'error', '请输入 API Key');
        return;
      }

      log('chatResult', 'warning', '正在测试...');

      try {
        const response = await fetch(`${baseUrl}/v1/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-5.6-luna',
            messages: [{ role: 'user', content: 'Say "Hello" in one word' }],
            max_tokens: 10
          })
        });

        const data = await response.json();
        
        if (response.ok) {
          log('chatResult', 'success', 
            `✓ Chat Completions 测试成功!\n` +
            `状态: ${response.status}\n` +
            `模型: ${data.model || 'N/A'}\n` +
            `响应: ${data.choices?.[0]?.message?.content || 'N/A'}`, data);
        } else {
          log('chatResult', 'error', 
            `✗ Chat Completions 测试失败!\n` +
            `状态: ${response.status}\n` +
            `错误: ${data.error?.message || response.statusText}`, data);
        }
      } catch (error) {
        log('chatResult', 'error', `✗ 请求失败: ${error.message}`);
      }
    }

    async function testGptImage2() {
      const { apiKey, baseUrl } = getConfig();
      const prompt = document.getElementById('imagePrompt').value.trim();
      const size = document.getElementById('imageSize').value.trim() || '1024x1024';

      if (!apiKey) {
        log('gptImageResult', 'error', '请输入 API Key');
        return;
      }

      log('gptImageResult', 'warning', `正在测试 GPT Image 2 生成... (尺寸: ${size})`);

      try {
        const response = await fetch(`${baseUrl}/v1/images/generations`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-image-2',
            prompt: prompt,
            size: size,
            n: 1
          })
        });

        const data = await response.json();
        
        if (response.ok) {
          const imageUrl = data.data?.[0]?.url || data.data?.[0]?.b64_json;
          log('gptImageResult', 'success',
            `✓ GPT Image 2 测试成功!\n` +
            `状态: ${response.status}\n` +
            `图片数量: ${data.data?.length || 0}\n` +
            `返回格式: ${data.data?.[0]?.url ? 'URL' : 'base64'}` + 
            (data.data?.[0]?.url ? `\n图片URL: ${data.data[0].url}` : ''), data);
          
          // 如果有图片URL，显示图片
          if (data.data?.[0]?.url) {
            document.getElementById('gptImageResult').innerHTML += 
              `<br><img src="${data.data[0].url}" style="max-width: 300px; border-radius: 5px; margin-top: 10px;">`;
          }
        } else {
          log('gptImageResult', 'error',
            `✗ GPT Image 2 测试失败!\n` +
            `状态: ${response.status}\n` +
            `错误: ${data.error?.message || JSON.stringify(data)}`, data);
        }
      } catch (error) {
        log('gptImageResult', 'error', `✗ 请求失败: ${error.message}`);
      }
    }

    async function testGeminiImage() {
      const { apiKey, baseUrl } = getConfig();
      const prompt = document.getElementById('geminiPrompt').value.trim();

      if (!apiKey) {
        log('geminiResult', 'error', '请输入 API Key');
        return;
      }

      log('geminiResult', 'warning', '正在测试 Gemini 图片生成...');

      try {
        const model = 'gemini-3.1-flash-image-preview';
        const response = await fetch(`${baseUrl}/v1beta/models/${model}:generateContent`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: prompt }]
            }],
            generationConfig: {
              responseModalities: ['TEXT', 'IMAGE']
            }
          })
        });

        const data = await response.json();
        
        if (response.ok) {
          // 检查是否有图片
          const imagePart = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
          if (imagePart?.inlineData) {
            const imgUrl = `data:${imagePart.inlineData.mimeType};base64,${imagePart.inlineData.data}`;
            log('geminiResult', 'success',
              `✓ Gemini 图片生成成功!\n` +
              `状态: ${response.status}\n` +
              `图片格式: ${imagePart.inlineData.mimeType}\n` +
              `图片大小: ${(imagePart.inlineData.data.length / 1024).toFixed(2)} KB`, data);
            
            document.getElementById('geminiResult').innerHTML += 
              `<br><img src="${imgUrl}" style="max-width: 300px; border-radius: 5px; margin-top: 10px;">`;
          } else {
            const textResponse = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('');
            log('geminiResult', 'success',
              `✓ Gemini 请求成功!\n` +
              `状态: ${response.status}\n` +
              `响应类型: 文本 (可能不支持图片生成)\n` +
              `文本响应: ${textResponse || 'N/A'}`, data);
          }
        } else {
          log('geminiResult', 'error',
            `✗ Gemini 图片生成失败!\n` +
            `状态: ${response.status}\n` +
            `错误: ${data.error?.message || JSON.stringify(data)}`, data);
        }
      } catch (error) {
        log('geminiResult', 'error', `✗ 请求失败: ${error.message}`);
      }
    }

    async function testModels() {
      const { apiKey, baseUrl } = getConfig();

      if (!apiKey) {
        log('modelsResult', 'error', '请输入 API Key');
        return;
      }

      log('modelsResult', 'warning', '正在获取模型列表...');

      try {
        // 尝试不同的端点
        const endpoints = [
          '/v1/models',
          '/v1beta/models',
          '/models'
        ];

        for (const endpoint of endpoints) {
          try {
            const response = await fetch(`${baseUrl}${endpoint}`, {
              method: 'GET',
              headers: {
                'Authorization': `Bearer ${apiKey}`
              }
            });

            if (response.ok) {
              const data = await response.json();
              const models = data.data || data.models || [];
              const modelList = models.map(m => m.id || m).join('\n');
              
              log('modelsResult', 'success',
                `✓ 模型列表获取成功!\n` +
                `端点: ${endpoint}\n` +
                `模型数量: ${models.length}\n\n` +
                `模型列表:\n${modelList}`, data);
              return;
            }
          } catch (e) {
            console.log(`端点 ${endpoint} 失败:`, e);
          }
        }

        // 如果所有端点都失败
        log('modelsResult', 'error',
          `✗ 无法获取模型列表\n` +
          `可能的原因:\n` +
          `1. OpenLux API 不提供模型列表端点\n` +
          `2. API Key 权限不足\n` +
          `3. Base URL 配置错误`);

      } catch (error) {
        log('modelsResult', 'error', `✗ 请求失败: ${error.message}`);
      }
    }
  </script>
</body>
</html>
