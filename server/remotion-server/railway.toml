[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# 启动命令由 Dockerfile CMD 决定，这里留空避免冲突
startCommand = ""
# Healthcheck 命中 /health 路由
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# ── 持久化卷（重要）──
# Railway 容器默认 /tmp 是 ephemeral，重启/重 deploy 后视频丢失。
# 在 Railway Dashboard → Service → Variables → Volume 挂载一个 Volume，
# MOUNT_PATH 设为 /data，然后用环境变量 REMOTION_OUTPUT_DIR=/data/remotion-out
# 覆盖默认输出目录。
#
# 命令行参考（不在这里执行，由用户在 Railway 控制台点击 Volume 挂载）：
#   railway volume create --size 5 --mount /data
#   railway variables --set "REMOTION_OUTPUT_DIR=/data/remotion-out"
#
# 不挂 Volume 也能用：服务器会保留最近 24 小时的 MP4（由 REMOTION_KEEP_OUTPUT_HOURS 控制），
# 但容器重启后仍会清空。生产建议挂 Volume 或上传到 S3/R2（README 里有方案）。